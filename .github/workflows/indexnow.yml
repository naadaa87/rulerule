name: 검색엔진에 새 페이지 알리기 (IndexNow)

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/build.mjs'
      - 'scripts/fun.mjs'
      - 'site.config.json'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cloudflare 배포 기다리기
        run: sleep 240
      - name: 네이버·빙에 알리기
        run: node scripts/indexnow.mjs
